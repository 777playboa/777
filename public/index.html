<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777 Auth Server</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d0f12;
            color: #eceff4;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #16191f;
            border: 1px solid #232730;
            border-radius: 12px;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        }
        .badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }
        .footer {
            border-top: 1px solid #232730;
            padding-top: 16px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">● SYSTEMS OPERATIONAL</div>
        <h1>777 AUTH SERVER</h1>
        <p>Authentication and cryptographic license enforcement gateway for Client 777 and Native Loader.</p>
        <div class="footer">v1.0.0 &bull; Supabase PostgreSQL Connected</div>
    </div>
</body>
</html>
